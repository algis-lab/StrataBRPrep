<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Strata Board Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect y='2' width='32' height='8' fill='%235FA83A'/%3E%3Crect y='12' width='24' height='8' fill='%238A3E9C'/%3E%3Crect y='22' width='30' height='8' fill='%232E9FB8'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#E6E9E2; --surface:#F5F6F1; --sunk:#DCE0D8; --ink:#1D2A31; --muted:#56666C; --line:#C3C9C0;
  --d1:#2B93AB; --d2:#86409A; --d3:#4F9A2E;
  --ok:#2A7A47; --ok-bg:#DCEEDF; --bad:#BD3B26; --bad-bg:#F6DED8; --warn:#9A6A00; --warn-bg:#F5EBCC;
  --focus:#2B93AB;
  --sans:"Archivo",system-ui,sans-serif; --serif:"Spectral",Georgia,serif;
  --r-sm:4px; --r-md:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141D21; --surface:#1C272C; --sunk:#111A1E; --ink:#E3E8E2; --muted:#93A3A6; --line:#2E3D43;
    --d1:#4DB6CF; --d2:#B57AC6; --d3:#7CC25A;
    --ok:#6CC88A; --ok-bg:#183326; --bad:#F0806B; --bad-bg:#3A1F1A; --warn:#E3B44B; --warn-bg:#352C14; --focus:#4DB6CF;
  }
}
:root[data-theme="dark"]{
  --bg:#141D21; --surface:#1C272C; --sunk:#111A1E; --ink:#E3E8E2; --muted:#93A3A6; --line:#2E3D43;
  --d1:#4DB6CF; --d2:#B57AC6; --d3:#7CC25A;
  --ok:#6CC88A; --ok-bg:#183326; --bad:#F0806B; --bad-bg:#3A1F1A; --warn:#E3B44B; --warn-bg:#352C14; --focus:#4DB6CF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);font-variation-settings:"wdth" 100}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:700;font-variation-settings:"wdth" 115;letter-spacing:-.01em;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 16px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.small{min-height:34px;padding:5px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font:600 .72rem/1 var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:3px 5px;color:var(--muted);background:var(--bg)}

/* ===== lock ===== */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lockbox{width:min(400px,100%)}
.lock-strata{display:flex;flex-direction:column;gap:3px;margin-bottom:28px}
.lock-strata span{height:12px;border-radius:2px;transform-origin:left}
.lock-strata span:nth-child(1){background:var(--d3);width:88%}
.lock-strata span:nth-child(2){background:var(--d2);width:64%}
.lock-strata span:nth-child(3){background:var(--d1);width:100%}
@media (prefers-reduced-motion:no-preference){
  .lock-strata span{animation:deposit .7s cubic-bezier(.2,.8,.2,1) both}
  .lock-strata span:nth-child(3){animation-delay:.05s}.lock-strata span:nth-child(2){animation-delay:.2s}.lock-strata span:nth-child(1){animation-delay:.35s}
}
@keyframes deposit{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lockbox h1{font-size:2.6rem;font-variation-settings:"wdth" 125;font-weight:800}
.lockbox p{margin:6px 0 24px;color:var(--muted)}
.pin{display:flex;gap:10px}
.pin input{flex:1;min-width:0;text-align:center;font:700 2rem/1 var(--sans);letter-spacing:.5em;padding:12px 0 12px .5em;border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.pin input:focus{border-color:var(--ink);outline:none}
.lock-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}
.lock-msg{min-height:1.5em;margin-top:12px;color:var(--bad);font-weight:500}
.lock-msg.busy{color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
label.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;color:var(--muted)}
label.check input{width:18px;height:18px;accent-color:var(--ink)}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-variation-settings:"wdth" 125;font-size:1.25rem;background:none;border:0;padding:0}
.brand i{display:flex;flex-direction:column;gap:2px;width:20px}
.brand i b{height:4px;border-radius:1px}
.brand i b:nth-child(1){background:var(--d3);width:80%}.brand i b:nth-child(2){background:var(--d2);width:60%}.brand i b:nth-child(3){background:var(--d1)}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.chip .gem{width:10px;height:10px;transform:rotate(45deg);border-radius:2px}
@media (max-width:640px){.top .hide-sm{display:none}}

/* ===== dashboard ===== */
.dash{display:grid;grid-template-columns:minmax(300px,410px) 1fr;gap:28px;padding:28px 0 64px;align-items:start}
.dash-side{grid-row:span 3}
@media (max-width:900px){.dash{grid-template-columns:1fr}.dash-side{grid-row:auto;order:3}.insights{order:4}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px}
.panel h2{font-size:1.15rem}
.panel .sub{color:var(--muted);font-size:.92rem;margin:4px 0 0}

/* strat column — the signature */
.column-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.column-head h2{font-size:1.15rem}
.strat{display:flex;flex-direction:column}
.bed{display:grid;grid-template-columns:45% 55%;align-items:stretch;background:none;border:0;padding:0;text-align:left;width:100%;border-top:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.bed:hover .rock{filter:brightness(1.08)}
.bed:hover .bed-label b{text-decoration:underline}
.rock-cell{display:block;position:relative;border-right:2px solid var(--ink);border-left:2px solid var(--ink)}
.rock{display:block;height:100%;background-color:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rock.p1{background-image:radial-gradient(color-mix(in srgb,var(--ink) 45%,transparent) 1px,transparent 1.4px);background-size:7px 7px}
.rock.p2{background-image:repeating-linear-gradient(60deg,transparent 0 6px,color-mix(in srgb,var(--ink) 30%,transparent) 6px 7px),repeating-linear-gradient(-60deg,transparent 0 6px,color-mix(in srgb,var(--ink) 30%,transparent) 6px 7px)}
.rock.p3{background-image:linear-gradient(color-mix(in srgb,var(--ink) 35%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 35%,transparent) 1px,transparent 1px);background-size:16px 8px}
.rock.empty{background-color:transparent}
.bed-label{padding:2px 0 2px 10px;font-size:.82rem;line-height:1.2;display:flex;flex-direction:column;justify-content:center;min-width:0}
.bed-label b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed-label span{color:var(--muted);font-variant-numeric:tabular-nums}
.unconf{display:grid;grid-template-columns:45% 55%;align-items:center;min-height:30px;padding:4px 0}
.unconf svg{width:100%;height:14px;display:block}
.unconf .day-name{padding-left:10px;font-weight:700;font-size:.8rem;line-height:1.2;color:var(--muted)}
.strat-base{height:2px;background:var(--ink);width:45%}
.legend{margin-top:14px;font-size:.84rem;color:var(--muted);line-height:1.45}

/* projection */
.proj{display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center}
@media (max-width:560px){.proj{grid-template-columns:1fr}}
.gwa{font-size:4.2rem;font-weight:800;font-variation-settings:"wdth" 70;line-height:.9;letter-spacing:-.02em}
.gwa small{font-size:1.4rem;font-weight:600}
.verdict{display:inline-block;margin-top:8px;font-weight:700;font-size:.9rem;padding:3px 8px;border-radius:var(--r-sm)}
.verdict.pass{background:var(--ok-bg);color:var(--ok)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.verdict.low{background:var(--warn-bg);color:var(--warn)}
.daybars{display:flex;flex-direction:column;gap:12px}
.daybar .row{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}
.daybar .row b{font-weight:600}
.track{position:relative;height:12px;background:var(--sunk);border-radius:2px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:2px}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.track .mark.m50{opacity:.4}

/* start + modes */
.start{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.start h2{font-size:1.5rem}
.goal{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-v);width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.mode:hover{border-color:var(--ink)}
.mode b{font-size:1.02rem;font-variation-settings:"wdth" 110}
.mode span{color:var(--muted);font-size:.88rem;line-height:1.4}
.mode em{font-style:normal;font-weight:700;font-size:.8rem;margin-top:auto;padding-top:4px}

.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.stat-big{font-size:2rem;font-weight:800;font-variation-settings:"wdth" 75;line-height:1}
.calib{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.calib .row{display:grid;grid-template-columns:62px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.focus-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.focus-list button{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;text-align:left}
.focus-list button:hover{border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--sunk)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--d3) 35%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--d3) 60%,var(--sunk))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--d3) 85%,var(--sunk))}
.heat i[data-l="4"]{background:var(--d3)}
.heat i.future{visibility:hidden}
.mohs{display:flex;gap:3px;margin-top:12px}
.mohs i{flex:1;height:22px;border-radius:2px;background:var(--sunk);display:grid;place-items:center;font:700 .7rem/1 var(--sans);font-style:normal;color:var(--muted)}
.mohs i.on{background:var(--ink);color:var(--bg)}
.sessions{list-style:none;margin:10px 0 0;padding:0;font-size:.9rem}
.sessions li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.empty-note{color:var(--muted);font-size:.92rem;margin:10px 0 0}

/* ===== setup screens ===== */
.page{padding:28px 0 64px;max-width:760px}
.page h1{font-size:2rem;font-variation-settings:"wdth" 120}
.page .lead{color:var(--muted);margin:6px 0 24px;max-width:60ch}
.field{margin-bottom:22px}
.field > .lbl{font-weight:700;margin-bottom:8px;display:block}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subj-group{margin-top:10px}
.subj-group h3{font-size:.95rem;display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px}
.subj-grid label{display:flex;gap:8px;align-items:center;font-size:.92rem;padding:3px 0;cursor:pointer}
.subj-grid label input{accent-color:var(--ink);width:16px;height:16px;flex:none}
.subj-grid label span.n{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
select,input[type=number],input[type=date],input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;min-height:42px}
.row-fields{display:flex;flex-wrap:wrap;gap:14px}
.row-fields > div{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.match{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}

/* ===== quiz ===== */
.qwrap{max-width:780px;margin:0 auto;padding:18px 20px 80px}
@media (max-width:600px){.qwrap{padding:12px 16px 80px}}
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.qbar .title{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.timer.low{color:var(--bad)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:18px}
.prog span{display:block;height:100%;background:var(--ink);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:24px}
@media (max-width:600px){.qcard{padding:18px}}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.tag::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.basis{border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.basis.A{border-color:var(--ink);color:var(--ink);font-weight:600}
.qtext{font:500 1.32rem/1.45 var(--serif);margin:0 0 20px;letter-spacing:0}
@media (max-width:600px){.qtext{font-size:1.15rem}}
.choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.choice{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:12px 14px;font:400 1.05rem/1.4 var(--serif)}
.choice kbd{margin-top:2px;flex:none}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.6}
.conf{margin-top:16px;padding:14px;border-radius:var(--r-md);background:var(--sunk)}
.conf p{margin:0 0 10px;font-weight:600}
.conf .btns{display:flex;flex-wrap:wrap;gap:8px}
.verdict-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:18px;font-weight:700;font-size:1.05rem}
.verdict-line.ok{color:var(--ok)}.verdict-line.bad{color:var(--bad)}
.explain{margin-top:10px;font:400 1.02rem/1.6 var(--serif);max-width:68ch}
.note{margin-top:12px;font-size:.9rem;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk)}
.note.verify{background:var(--warn-bg);color:var(--warn)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin-top:22px}
.palette button{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.palette button.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.palette button.cur{outline:2px solid var(--focus);outline-offset:1px}
.palette button.fl{box-shadow:inset 0 -4px 0 var(--warn)}
.hint{font-size:.82rem;color:var(--muted);margin-top:14px}
@media (hover:none){.hint{display:none}}

/* sprint */
.seismo{width:100%;height:90px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:14px}
.quake{animation:quake .4s}
@keyframes quake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(2px,-1px)}}
@media (prefers-reduced-motion:reduce){.quake{animation:none}}
.sprint-score{display:flex;gap:18px;align-items:baseline}
.sprint-score b{font-size:1.6rem;font-variation-settings:"wdth" 75}

/* results */
.res-head{display:flex;flex-wrap:wrap;gap:24px 40px;align-items:flex-end;margin:10px 0 24px}
.res-big{font-size:5rem;font-weight:800;font-variation-settings:"wdth" 65;line-height:.85}
.res-big small{font-size:1.6rem}
.res-stats{display:flex;gap:28px;flex-wrap:wrap}
.res-stats div{display:flex;flex-direction:column}
.res-stats b{font-size:1.4rem;font-variation-settings:"wdth" 80}
.res-stats span{color:var(--muted);font-size:.88rem}
table.breakdown{width:100%;border-collapse:collapse;font-size:.92rem}
table.breakdown th,table.breakdown td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.breakdown th{color:var(--muted);font-weight:600}
table.breakdown td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.minibar{height:8px;background:var(--sunk);border-radius:2px;min-width:60px}
.minibar span{display:block;height:100%;border-radius:2px}
details.item{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:8px}
details.item summary{padding:12px 14px;cursor:pointer;font:500 1rem/1.45 var(--serif);list-style:none;display:flex;gap:10px}
details.item summary::-webkit-details-marker{display:none}
details.item summary .st{flex:none;margin-top:6px}
details.item .body{padding:0 14px 14px 34px}
details.item .body ul{margin:0 0 8px;padding-left:18px;font-family:var(--serif)}
details.item .body li.ans{color:var(--ok);font-weight:600}
details.item .body li.pick{color:var(--bad);text-decoration:line-through}
.section-title{font-size:1.2rem;margin:30px 0 12px}

/* browse */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.toolbar input[type=search]{flex:1 1 240px}
.count{color:var(--muted);font-size:.9rem;margin-bottom:10px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);padding:24px;width:min(520px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,16,20,.45)}
dialog h2{font-size:1.3rem;margin-bottom:16px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.set-row div span{display:block;color:var(--muted);font-size:.86rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-weight:600;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- storage helpers ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => Math.round(x * 100);
const now = () => Date.now();
const DAY = 864e5;
const dayKey = (t=now()) => { const d = new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmtTime = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

/* ---------- unlock ---------- */
async function decryptVault(pin){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(VAULT.salt), iterations:VAULT.it, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(VAULT.iv)}, key, b(VAULT.ct));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
async function tryUnlock(pin, silent){
  const msg = $("#lockMsg");
  if(!window.crypto || !crypto.subtle){ msg.textContent = "This page needs HTTPS (GitHub Pages provides it) to unlock."; return; }
  msg.className = "lock-msg busy"; msg.textContent = "Unlocking the question bank…";
  try{
    const data = await decryptVault(pin);
    if($("#remember").checked) LS.set(KEY_PIN, pin);
    start(data);
  }catch(e){
    if(silent){ LS.del(KEY_PIN); msg.textContent = ""; return; }
    msg.className = "lock-msg"; msg.textContent = "That PIN didn't unlock the bank. Check it and try again.";
    const f = $("#lockForm"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    $("#pinInput").select();
  }
}
$("#lockForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#pinInput").value.trim(); if(v) tryUnlock(v); });
function lockApp(){ LS.del(KEY_PIN); location.reload(); }

/* ---------- data model ---------- */
const DAYS = {1:"General Geology", 2:"Petrology & Mineralogy", 3:"Applied Geology"};
const BASIS = {A:"2019 board paper", R:"Examinee recall", T:"Trend topic"};
const MOHS = [["Talc",0],["Gypsum",20],["Calcite",60],["Fluorite",120],["Apatite",200],["Orthoclase",320],["Quartz",460],["Topaz",620],["Corundum",820],["Diamond",1000]];
const INTERVALS = [10*60e3, 1*DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];   // Leitner box review gaps
const STABILITY = [0.3, 2, 5, 12, 30, 70];                          // days, for the forgetting curve
const CONF = {1:"Sure", 2:"Unsure", 3:"Guess"};
const MODE_NAMES = {smart:"Smart review", drill:"Subject drill", mock:"Mock board exam", sprint:"Seismic sprint", retry:"Missed items"};
let Q = [], QI = {}, SUBJ = [], P, S = null;

function defaultProgress(){
  return {v:1, items:{}, flags:{}, log:[], days:{}, sessions:[], sprintBest:0,
    settings:{askConf:true, goal:30, examDate:"", theme:"auto", smartSize:20, mockItems:100, mockMin:120}};
}
function save(){
  if(P.log.length > 8000) P.log = P.log.slice(-8000);
  if(P.sessions.length > 200) P.sessions = P.sessions.slice(-200);
  if(!LS.set(KEY_P, P)) toast("Progress couldn't be saved in this browser. Export it from Settings to keep it.");
}
function start(data){
  Q = data.sort((a,b) => a.id - b.id);
  Q.forEach(q => QI[q.id] = q);
  const seen = {};
  Q.forEach(q => { if(!seen[q.s]){ seen[q.s] = {name:q.s, day:q.d, ids:[]}; SUBJ.push(seen[q.s]); } seen[q.s].ids.push(q.id); });
  P = Object.assign(defaultProgress(), LS.get(KEY_P, {}));
  P.settings = Object.assign(defaultProgress().settings, P.settings || {});
  applyTheme();
  $("#lock").hidden = true; $("#app").hidden = false;
  home();
}
function applyTheme(){ const t = P.settings.theme; if(t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }

/* ---------- scoring engine ---------- */
const it = id => P.items[id];
function record(id, ok, conf, ms, mode){
  const t = now();
  let r = P.items[id];
  if(!r){ r = P.items[id] = {n:0, c:0, box:0, due:0, last:0, first:ok?1:0}; }
  r.n++; if(ok) r.c++;
  r.last = t; r.lr = ok ? 1 : 0; r.conf = conf || 0;
  if(ok){
    if(conf === 3) r.box = Math.max(r.box, 1);          // a lucky guess doesn't earn promotion
    else r.box = Math.min(5, r.box + 1);
    if(r.blind && conf === 1) delete r.blind;
  }else{
    if(conf === 1) r.blind = 1;                          // confidently wrong = blind spot
    r.box = 0;
  }
  r.due = t + INTERVALS[r.box];
  P.log.push([t, id, ok?1:0, conf||0, Math.round(ms||0), mode]);
  const k = dayKey(t); P.days[k] = (P.days[k] || 0) + 1;
}
function itemMastery(id){ const r = it(id); return r ? r.box / 5 : 0; }
function recallP(id, prior){
  const r = it(id);
  if(!r) return prior;
  const dt = (now() - r.last) / DAY;
  const ret = Math.exp(-dt / STABILITY[r.box]);
  return r.box === 0 ? 0.25 + 0.75 * 0.3 * ret + 0.75*0.1 : 0.25 + 0.75 * ret;
}
function subjectStats(sub){
  let m = 0, seen = 0, firstN = 0, firstOk = 0, mastered = 0, due = 0;
  const t = now();
  for(const id of sub.ids){
    const r = it(id);
    if(r){ seen++; m += r.box/5; firstN++; firstOk += r.first; if(r.box >= 3) mastered++; if(r.due <= t) due++; }
  }
  const prior = (firstOk + 2*0.45) / (firstN + 2);
  let p = 0; for(const id of sub.ids) p += recallP(id, prior);
  return {mastery: m / sub.ids.length, coverage: seen / sub.ids.length, seen, mastered, due, proj: p / sub.ids.length, n: sub.ids.length};
}
function projection(){
  const days = {1:{p:0,n:0},2:{p:0,n:0},3:{p:0,n:0}};
  const per = {};
  for(const s of SUBJ){ const st = subjectStats(s); per[s.name] = st; days[s.day].p += st.proj * st.n; days[s.day].n += st.n; }
  const dr = [1,2,3].map(d => days[d].p / days[d].n);
  const gwa = (dr[0] + dr[1] + dr[2]) / 3;
  const seen = Object.keys(P.items).length;
  return {dr, gwa, per, coverage: seen / Q.length, seen};
}
function rank(){
  let mastered = 0; for(const k in P.items) if(P.items[k].box >= 3) mastered++;
  let i = 0; while(i+1 < MOHS.length && mastered >= MOHS[i+1][1]) i++;
  return {i, name:MOHS[i][0], hardness:i+1, mastered, next: MOHS[i+1] || null};
}
function streak(){
  let s = 0, t = now();
  if((P.days[dayKey(t)] || 0) < 10) t -= DAY;
  while((P.days[dayKey(t)] || 0) >= 10){ s++; t -= DAY; }
  return s;
}
function calibration(){
  const b = {1:[0,0],2:[0,0],3:[0,0]};
  for(const e of P.log.slice(-1500)) if(e[3]) { b[e[3]][0] += e[2]; b[e[3]][1]++; }
  let blind = 0; for(const k in P.items) if(P.items[k].blind) blind++;
  return {b, blind};
}
function pace(){
  const xs = P.log.filter(e => e[5] !== "sprint" && e[4] > 0 && e[4] < 600000).slice(-300);
  if(!xs.length) return null;
  return xs.reduce((a,e) => a + e[4], 0) / xs.length / 1000;
}
function dueIds(){ const t = now(); return Object.keys(P.items).filter(k => P.items[k].due <= t).map(Number); }
function missedIds(){ return Object.keys(P.items).filter(k => P.items[k].lr === 0).map(Number); }

/* ---------- queues ---------- */
function smartQueue(size){
  const t = now();
  const due = Object.keys(P.items).map(Number).filter(id => P.items[id].due <= t)
    .sort((a,b) => (P.items[b].blind||0) - (P.items[a].blind||0) || P.items[a].due - P.items[b].due);
  const nDue = Math.min(due.length, Math.ceil(size * 0.6));
  const picked = new Set(due.slice(0, nDue));
  // fill with new items, weighted toward weak, heavy subjects
  const pools = SUBJ.map(s => { const st = subjectStats(s); return {ids: shuffle(s.ids.filter(id => !P.items[id])), w: (1 - st.mastery + 0.08) * Math.sqrt(s.ids.length)}; }).filter(p => p.ids.length);
  while(picked.size < size && pools.some(p => p.ids.length)){
    const live = pools.filter(p => p.ids.length); const tot = live.reduce((a,p) => a + p.w, 0);
    let x = Math.random() * tot, chosen = live[0];
    for(const p of live){ x -= p.w; if(x <= 0){ chosen = p; break; } }
    picked.add(chosen.ids.pop());
  }
  // still short (everything seen): take the least-mastered, soonest-due items
  if(picked.size < size){
    const rest = Q.map(q => q.id).filter(id => !picked.has(id)).sort((a,b) => (P.items[a].box - P.items[b].box) || (P.items[a].due - P.items[b].due));
    for(const id of rest){ if(picked.size >= size) break; picked.add(id); }
  }
  return shuffle([...picked]);
}
function mockQueue(day, n){
  const subs = SUBJ.filter(s => day === 0 || s.day === day);
  const ids = [];
  const days = day === 0 ? [1,2,3] : [day];
  for(const d of days){
    const ds = subs.filter(s => s.day === d); const tot = ds.reduce((a,s) => a + s.ids.length, 0);
    let want = ds.map(s => ({s, k: Math.floor(n * s.ids.length / tot), frac: (n * s.ids.length / tot) % 1}));
    let left = n - want.reduce((a,w) => a + w.k, 0);
    want.sort((a,b) => b.frac - a.frac).forEach(w => { if(left > 0){ w.k++; left--; } });
    const part = []; want.forEach(w => part.push(...shuffle(w.s.ids).slice(0, w.k)));
    ids.push(...shuffle(part));
  }
  return ids;
}

/* ---------- session ---------- */
const PIN_LAST = /^(all|none|neither|both) of (these|the above|them)\.?$/i;
function choiceOrder(q){
  const o = shuffle([0,1,2,3]);
  const tail = o.filter(i => PIN_LAST.test(q.c[i])), head = o.filter(i => !PIN_LAST.test(q.c[i]));
  return head.concat(tail);
}
function startSession(mode, ids, opts={}){
  if(!ids.length){ toast("No items match that selection."); return; }
  S = {mode, ids, i:0, ans:{}, order:{}, flags:{}, t0:now(), qt:now(), limit:opts.limit||0, title: opts.title || MODE_NAMES[mode], day:opts.day, meta:opts};
  ids.forEach(id => S.order[id] = choiceOrder(QI[id]));
  if(mode === "sprint"){ S.score = 0; S.wrong = 0; S.penalty = 0; S.trace = []; }
  clearInterval(window._tick);
  if(S.limit) window._tick = setInterval(tick, 250);
  renderQuiz();
}
function remaining(){ return S.limit - (now() - S.t0)/1000 - (S.penalty||0); }
function tick(){
  if(!S) return clearInterval(window._tick);
  const r = remaining(); const el = $("#timer");
  if(el){ el.textContent = fmtTime(r); el.classList.toggle("low", r < (S.mode === "sprint" ? 15 : 300)); }
  if(r <= 0){ clearInterval(window._tick); if(S.mode === "sprint") finishSprint(); else finishMock(true); }
}

function heatmap(){
  const weeks = 18, end = new Date(); end.setHours(0,0,0,0);

  for(let i=0; i<weeks*7; i++){
    const d = new Date(startD); d.setDate(startD.getDate() + i);
    if(d > end){ h += `<i class="future"></i>`; continue; }
    const n = P.days[dayKey(d.getTime())] || 0;
    const l = n === 0 ? 0 : n < 10 ? 1 : n < 25 ? 2 : n < 50 ? 3 : 4;
    h += `<i data-l="${l}" title="${dayKey(d.getTime())}: ${n} answers"></i>`;
  }

}

function pick(ci){

  if(S.mode === "sprint"){ sprintAnswer(ci); return; }
  a.pick = ci;
  if(P.settings.askConf) renderQuiz(); else commit(0);
}
function commit(conf){
  const a = S.ans[S.i]; if(!a || a.pick == null || a.done) return;
  const id = S.ids[S.i], q = QI[id];
  a.conf = conf; a.done = true; a.ms = now() - S.qt; a.ok = a.pick === q.a;
  record(id, a.ok, conf, a.ms, S.mode); save();
  renderQuiz();
}
function next(){

  S.i++; S.qt = now(); renderQuiz(); window.scrollTo(0,0);
}
function skip(){

}

}

}

/* ----- mock flow ----- */

/* ----- sprint ----- */
function sprintGo(v){
  let pool = Q.filter(q => v === 0 || v === 9 || q.d === v).map(q => q.id);
  if(v === 9) pool = pool.filter(id => P.items[id]);
  if(v === 9 && pool.length < 20){ toast("Answer at least 20 items first, or pick another pool."); return; }
  startSession("sprint", shuffle(pool), {limit: 90, title: "Seismic sprint"});
}
function sprintAnswer(ci){
  const id = S.ids[S.i], q = QI[id], ok = ci === q.a;
  S.ans[S.i] = {pick:ci, done:true, ok, ms: now() - S.qt};
  record(id, ok, 0, now() - S.qt, "sprint");
  if(ok) S.score++; else { S.wrong++; S.penalty += 5; }
  S.trace.push(ok ? 1 : -1);
  const btn = document.querySelector(`.choice[data-c="${ci}"]`);
  document.querySelectorAll(".choice").forEach(b => b.disabled = true);
  if(btn) btn.classList.add(ok ? "right" : "wrong");
  if(!ok){ const right = document.querySelector(`.choice[data-c="${q.a}"]`); if(right) right.classList.add("right"); const c = $("#qcard"); c.classList.remove("quake"); void c.offsetWidth; c.classList.add("quake"); }
  setTimeout(() => {
    if(!S || S.mode !== "sprint") return;
    if(remaining() <= 0) return finishSprint();
    S.i++; if(S.i >= S.ids.length){ S.ids = S.ids.concat(shuffle(S.ids)); }
    S.qt = now(); renderQuiz();

}
function drawSeismo(){
  const c = $("#seismo"); if(!c) return;
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w*dpr; c.height = h*dpr; const g = c.getContext("2d"); g.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement);
  g.strokeStyle = cs.getPropertyValue("--line"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  const pts = 140, step = w / pts, ev = S.trace.slice(-12);
  g.strokeStyle = cs.getPropertyValue("--ink"); g.lineWidth = 1.4; g.beginPath();
  let seed = S.trace.length * 7 + 3; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for(let i=0;i<=pts;i++){
    let y = (rnd()-.5) * 3;
    ev.forEach((e,j) => { const center = pts - (ev.length - j) * (pts/13); const d = i - center; if(Math.abs(d) < 9){ const amp = e > 0 ? 9 : h*0.42; y += Math.sin(d*2.1) * amp * Math.exp(-Math.abs(d)/3); } });
    const x = i*step; i ? g.lineTo(x, h/2 + y) : g.moveTo(x, h/2 + y);
  }
  g.stroke();
}
function finishSprint(){
  clearInterval(window._tick);
  const best = S.score > P.sprintBest; if(best) P.sprintBest = S.score;
  const res = Object.entries(S.ans).map(([k,a]) => ({id:S.ids[k], ok:a.ok, pick:a.pick, ms:a.ms, conf:0}));
  P.sessions.push({t:now(), mode:"sprint", title:"Seismic sprint", n:res.length, c:S.score}); save();
  showResults(res, false, {sprint:true, best});
}

  }

    </div>

    case "mockGo": mockGo(); break;
    case "sprintSetup": sprintSetup(); break;
    case "sprintGo": sprintGo(+v); break;
    case "retryMissed": startSession("retry", shuffle(missedIds()).slice(0, 50), {title:"Fix mistakes"}); break;
    case "retryThese": startSession("retry", shuffle(el.dataset.ids.split(",").map(Number)), {title:"Missed items"}); break;
    case "quizThese": startSession("drill", shuffle(el.dataset.ids.split(",").map(Number)), {title:"Browse selection"}); break;
    case "browse": browse(); break;
    case "more": B.shown += 40; renderBrowseList(); break;
    case "pick": pick(+el.dataset.c); break;
    case "conf": commit(+v); break;
    case "next": next(); break;
    case "skip": skip(); break;
    case "flag": toggleFlag(S.ids[S.i]); renderQuiz(); break;
    case "bflag": { toggleFlag(+el.dataset.id); const f = P.flags[+el.dataset.id]; el.setAttribute("aria-pressed", String(!!f)); el.textContent = f ? "Flagged" : "Flag item"; break; }
    case "quit": if(!Object.values(S.ans).some(a => a.done) || confirm("End this session? Answers so far are saved.")) finishPractice(); break;
    case "mquit": if(confirm("Leave the mock exam? It won't be scored.")) home(); break;
    case "mprev": S.i--; S.qt = now(); renderQuiz(); break;
    case "mnext": S.i++; S.qt = now(); renderQuiz(); break;
    case "mjump": S.i = +v; S.qt = now(); renderQuiz(); break;
    case "mflag": S.flags[S.i] = !S.flags[S.i]; renderQuiz(); break;
    case "msubmit": { const left = S.ids.length - Object.keys(S.ans).length; if(confirm(left ? `${left} item${left===1?" is":"s are"} unanswered. Submit anyway?` : "Submit the exam?")) finishMock(false); break; }
  }
});
function toggleFlag(id){
  if(P.flags[id]) delete P.flags[id]; else P.flags[id] = 1; save();
}
document.addEventListener("keydown", e => {
  if(!S || e.target.matches("input,select,textarea") || e.metaKey || e.ctrlKey || e.altKey || $("#settings").open) return;
  const a = S.ans[S.i] || {}, k = e.key.toLowerCase();
  if(/^[1-4]$/.test(k)){
    const order = S.order[S.ids[S.i]];
    if(!a.done || S.mode === "mock"){ e.preventDefault(); pick(order[+k-1]); }
    return;
  }
  if(S.mode === "mock"){
    if(k === "arrowright" && S.i < S.ids.length-1){ S.i++; renderQuiz(); }
    else if(k === "arrowleft" && S.i > 0){ S.i--; renderQuiz(); }
    else if(k === "m"){ S.flags[S.i] = !S.flags[S.i]; renderQuiz(); }
    return;
  }
  if(S.mode === "sprint") return;
  if(a.pick != null && !a.done && ({s:1,u:2,g:3})[k]){ e.preventDefault(); commit(({s:1,u:2,g:3})[k]); return; }
  if(k === "f"){ toggleFlag(S.ids[S.i]); renderQuiz(); return; }
  if((k === "enter" || k === " ") && a.done){ e.preventDefault(); next(); }
});
window.addEventListener("resize", () => { if(S && S.mode === "sprint") drawSeismo(); });

/* ---------- boot ---------- */
(function boot(){
  if(!VAULT){ $("#lockMsg").textContent = "No question bank was built into this page. Run build.py."; return; }
  const saved = LS.get(KEY_PIN, null);
  if(saved){ $("#remember").checked = true; tryUnlock(saved, true); }
})();
</script>
